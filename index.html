<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundt — Landing concepts</title>
  <meta name="description" content="Fundt landing design concepts from design-taste-frontend and impeccable." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="switcher.css" />
</head>
<body>
  <div class="studio" id="studio">
    <div class="studio-bar" role="region" aria-label="Concept switcher">
      <div class="studio-brand">
        <img src="assets/icon.png" alt="" width="28" height="28" />
        <div>
          <strong>Fundt landing</strong>
          <span>Concept studio</span>
        </div>
      </div>

      <label class="skill-field">
        <span>Skill output</span>
        <select id="skillSelect" aria-label="Skill output">
          <option value="taste">design-taste-frontend</option>
          <option value="impeccable">impeccable</option>
        </select>
      </label>

      <div class="style-tabs" role="tablist" aria-label="Style options" id="styleTabs"></div>

      <a class="studio-link" href="privacy.html">Privacy</a>
    </div>

    <iframe
      id="stage"
      class="stage"
      title="Fundt landing concept"
      src="variants/taste-flow.html"
    ></iframe>
  </div>

  <script src="switcher.js"></script>
</body>
</html>
